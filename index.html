<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Duetto Controller</title>
  <style>
    :root { --bg:#0b1020; --card:#141b2d; --text:#e8ecf7; --muted:#9aa6c3; --ok:#2ecc71; --bad:#ff5c77; --btn:#2c4cff; --line:#27314d; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:linear-gradient(180deg,#09101d,#0b1020); color:var(--text); }
    .wrap { max-width:820px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
    h1 { margin:0 0 12px; font-size:22px; }
    h2 { margin:0 0 10px; font-size:16px; color:#d7def3; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 6px; }
    input, button, select, textarea {
      width:100%; box-sizing:border-box; border-radius:12px; border:1px solid var(--line);
      background:#0f1730; color:var(--text); padding:12px 14px; font-size:16px;
    }
    button { background:var(--btn); border:none; font-weight:700; cursor:pointer; }
    button.secondary { background:#223055; }
    button.danger { background:#b83d57; }
    button.good { background:#1f8f5a; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .status { display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:14px; color:var(--muted); }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); display:inline-block; }
    .dot.ok { background:var(--ok); }
    .big { font-size:18px; font-weight:700; }
    .muted { color:var(--muted); }
    .sliderwrap { display:grid; grid-template-columns:1fr 64px; gap:10px; align-items:center; }
    input[type=range] { padding:0; height:44px; }
    .toast {
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background:#111a33; border:1px solid var(--line); color:var(--text);
      padding:10px 14px; border-radius:999px; opacity:0; transition:.25s; pointer-events:none;
    }
    .toast.show { opacity:1; }
    .small { font-size:12px; color:var(--muted); word-break:break-all; }
    textarea { min-height:90px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Duetto Controller</h1>

  <div class="card">
    <div class="status">
      <span class="dot" id="connDot"></span>
      <span id="connText">Disconnected</span>
      <span>•</span>
      <span>Power: <span id="powerText">?</span></span>
      <span>•</span>
      <span>Volume: <span id="volText">?</span></span>
    </div>
    <div class="small" id="lastUrl"></div>
  </div>

  <div class="card">
    <h2>Connection</h2>
    <label>Host IP</label>
    <input id="host" placeholder="192.168.68.70" />
    <label>PIN</label>
    <input id="pin" placeholder="1234" />
    <div class="row" style="margin-top:12px;">
      <button id="saveBtn">Save</button>
      <button id="testBtn" class="secondary">Test Connection</button>
    </div>
  </div>

  <div class="card">
    <h2>Power</h2>
    <div class="row">
      <button id="onBtn" class="good">Power On</button>
      <button id="offBtn" class="danger">Power Off</button>
    </div>
  </div>

  <div class="card">
    <h2>Volume</h2>
    <div class="sliderwrap">
      <input id="vol" type="range" min="0" max="40" step="1" value="0" />
      <input id="volNum" type="number" min="0" max="40" step="1" value="0" />
    </div>
    <div class="row3" style="margin-top:10px;">
      <button id="volDown" class="secondary">-</button>
      <button id="muteBtn" class="secondary">Mute</button>
      <button id="volUp" class="secondary">+</button>
    </div>
    <div style="margin-top:10px;">
      <button id="setVolBtn">Set Volume</button>
    </div>
  </div>

  <div class="card">
    <h2>Raw Command</h2>
    <label>Path or full URL</label>
    <textarea id="rawInput" placeholder="/fsapi/GET/netRemote.sys.power?pin=1234"></textarea>
    <div class="row" style="margin-top:12px;">
      <button id="rawGetBtn" class="secondary">Run GET</button>
      <button id="rawSetBtn" class="secondary">Run SET</button>
    </div>
    <div class="small" id="rawOut" style="margin-top:10px;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { muted:false, lastVol:17, connected:false };
  const LS_HOST = "duetto_host";
  const LS_PIN = "duetto_pin";

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function saveCfg() {
    localStorage.setItem(LS_HOST, $("host").value.trim());
    localStorage.setItem(LS_PIN, $("pin").value.trim());
  }

  function loadCfg() {
    $("host").value = localStorage.getItem(LS_HOST) || "192.168.68.70";
    $("pin").value = localStorage.getItem(LS_PIN) || "1234";
  }

  function baseUrl() {
    return "http://" + $("host").value.trim() + "/fsapi/";
  }

  function withBust(url) {
    return url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
  }

  function apiUrl(op, node, value) {
    const pin = encodeURIComponent($("pin").value.trim() || "1234");
    let u = baseUrl() + op + "/" + node + "?pin=" + pin;
    if (typeof value !== "undefined") u += "&value=" + encodeURIComponent(value);
    return withBust(u);
  }

  function parseValue(xml) {
    const m = xml.match(/<value><(?:u8|s16|u32|string|boolean)>(.*?)<\/(?:u8|s16|u32|string|boolean)><\/value>/i)
           || xml.match(/<value>(.*?)<\/value>/i);
    return m ? m[1] : "";
  }

  async function getText(url) {
    $("lastUrl").textContent = url;
    const r = await fetch(url, { cache:"no-store", mode:"cors" });
    return await r.text();
  }

  async function getApi(node) {
    return await getText(apiUrl("GET", node));
  }

  async function setApi(node, value) {
    const url = apiUrl("SET", node, value);
    $("lastUrl").textContent = url;
    try {
      const r = await fetch(url, { cache:"no-store", mode:"cors" });
      return await r.text();
    } catch (e) {
      const img = new Image();
      img.src = url;
      return "FS_OK";
    }
  }

  async function refreshStatus() {
    try {
      const p = await getApi("netRemote.sys.power");
      const v = await getApi("netRemote.sys.audio.volume");
      const power = parseValue(p);
      const vol = parseValue(v);
      $("powerText").textContent = power === "1" ? "On" : "Off";
      $("volText").textContent = vol;
      $("vol").value = vol;
      $("volNum").value = vol;
      $("connText").textContent = "Connected";
      $("connDot").classList.add("ok");
      state.connected = true;
    } catch (e) {
      $("connText").textContent = "Disconnected";
      $("connDot").classList.remove("ok");
      state.connected = false;
    }
  }

  $("saveBtn").onclick = () => { saveCfg(); toast("Saved"); };
  $("testBtn").onclick = async () => {
    saveCfg();
    try {
      const txt = await getApi("netRemote.sys.power");
      $("rawOut").textContent = txt;
      toast("Connection OK");
    } catch (e) {
      toast("Connection failed");
    }
  };

  $("onBtn").onclick = async () => {
    saveCfg();
    await setApi("netRemote.sys.power", 1);
    toast("Power On sent");
    setTimeout(refreshStatus, 800);
  };

  $("offBtn").onclick = async () => {
    saveCfg();
    await setApi("netRemote.sys.power", 0);
    toast("Power Off sent");
    setTimeout(refreshStatus, 800);
  };

  function syncVol(v) {
    $("vol").value = v;
    $("volNum").value = v;
  }

  $("vol").oninput = e => syncVol(e.target.value);
  $("volNum").oninput = e => syncVol(e.target.value);

  $("setVolBtn").onclick = async () => {
    saveCfg();
    const v = parseInt($("volNum").value || "0", 10);
    await setApi("netRemote.sys.audio.volume", v);
    toast("Volume set");
    setTimeout(refreshStatus, 500);
  };

  $("volUp").onclick = async () => {
    const v = Math.min(40, (parseInt($("volNum").value || "0", 10) + 1));
    syncVol(v);
    await setApi("netRemote.sys.audio.volume", v);
    toast("Volume +");
  };

  $("volDown").onclick = async () => {
    const v = Math.max(0, (parseInt($("volNum").value || "0", 10) - 1));
    syncVol(v);
    await setApi("netRemote.sys.audio.volume", v);
    toast("Volume -");
  };

  $("muteBtn").onclick = async () => {
    if (!state.muted) {
      state.lastVol = parseInt($("volNum").value || "17", 10);
      await setApi("netRemote.sys.audio.volume", 0);
      $("muteBtn").textContent = "Unmute";
      state.muted = true;
      toast("Muted");
    } else {
      await setApi("netRemote.sys.audio.volume", state.lastVol || 17);
      $("muteBtn").textContent = "Mute";
      state.muted = false;
      toast("Unmuted");
    }
    setTimeout(refreshStatus, 500);
  };

  $("rawGetBtn").onclick = async () => {
    saveCfg();
    const inp = $("rawInput").value.trim();
    const url = inp.startsWith("http") ? withBust(inp) :
      withBust(baseUrl() + (inp.startsWith("/") ? inp.slice(1) : inp));
    try { $("rawOut").textContent = await getText(url); }
    catch (e) { $("rawOut").textContent = String(e); }
  };

  $("rawSetBtn").onclick = async () => {
    saveCfg();
    const inp = $("rawInput").value.trim();
    const url = inp.startsWith("http") ? withBust(inp) :
      withBust(baseUrl() + (inp.startsWith("/") ? inp.slice(1) : inp));
    try {
      const r = await fetch(url, { mode:"cors", cache:"no-store" });
      $("rawOut").textContent = await r.text();
    } catch (e) {
      const img = new Image();
      img.src = url;
      $("rawOut").textContent = "Sent via image fallback";
    }
  };

  loadCfg();
  refreshStatus();
  setInterval(refreshStatus, 5000);
})();
</script>
</body>
</html>
