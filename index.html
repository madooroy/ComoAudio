<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Como Audio Duetto Controller</title>
  <style>
    :root { color-scheme: light dark; --bg:#0b0f14; --card:#141a22; --muted:#8ea0b6; --text:#e8eef7; --accent:#4da3ff; --good:#2ecc71; --bad:#ff6b6b; --line:#243041; }
    body { margin:0; font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:920px; margin:0 auto; padding:16px; }
    h1 { font-size:1.2rem; margin:0 0 12px; }
    .banner { padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin:10px 0 14px; background:rgba(255,255,255,.03); }
    .ok { border-color:rgba(46,204,113,.4); }
    .bad { border-color:rgba(255,107,107,.45); }
    .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
    label { display:block; font-size:.9rem; color:var(--muted); margin:8px 0 6px; }
    input, select, button, textarea { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid var(--line); background:#0f141b; color:var(--text); padding:12px; font:inherit; }
    button { cursor:pointer; background:linear-gradient(180deg,#1b2533,#111722); }
    button.primary { background:linear-gradient(180deg,#2166c7,#17489c); border-color:#2b6fd2; }
    button.good { background:linear-gradient(180deg,#1f7a42,#155a31); border-color:#2f9b57; }
    button.bad { background:linear-gradient(180deg,#8c2d2d,#641f1f); border-color:#b14343; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .inline { display:flex; gap:10px; align-items:center; }
    .inline > * { flex:1; }
    .small { font-size:.9rem; color:var(--muted); }
    .status { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; word-break:break-word; min-height:44px; }
    textarea { min-height:84px; resize:vertical; }
    .sliderWrap { display:flex; gap:10px; align-items:center; }
    input[type="range"] { padding:0; }
    .pill { display:inline-block; padding:4px 8px; border:1px solid var(--line); border-radius:999px; margin-right:8px; color:var(--muted); }
    .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#111826; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:10px 14px; opacity:0; pointer-events:none; transition:opacity .2s; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Como Audio Duetto Controller</h1>
  <div id="banner" class="banner">Ready.</div>

  <div class="grid">
    <div class="card">
      <h3>Connection</h3>
      <label>Host IP</label>
      <input id="host" value="192.168.68.70" />
      <label>PIN</label>
      <input id="pin" value="1234" />
      <div class="row" style="margin-top:10px;">
        <button id="saveBtn" class="primary">Save</button>
        <button id="testBtn">Test Connection</button>
      </div>
      <div class="status" id="connOut" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h3>Power</h3>
      <div class="row">
        <button id="onBtn" class="good">Power On</button>
        <button id="offBtn" class="bad">Power Off</button>
      </div>
      <div class="small" style="margin-top:10px;">Status: <span id="powerState">unknown</span></div>
    </div>

    <div class="card">
      <h3>Volume</h3>
      <div class="sliderWrap">
        <button id="volDown">-</button>
        <input id="vol" type="range" min="0" max="40" value="17" />
        <button id="volUp">+</button>
      </div>
      <div class="inline" style="margin-top:10px;">
        <div class="pill">Volume: <span id="volVal">17</span></div>
        <button id="muteBtn">Mute</button>
      </div>
    </div>

    <div class="card">
      <h3>Raw Command</h3>
      <label>Full path after host (e.g. /fsapi/GET/netRemote.sys.power?pin=1234)</label>
      <textarea id="rawIn"></textarea>
      <div class="row" style="margin-top:10px;">
        <button id="rawGet">Send GET</button>
        <button id="rawSet">Send SET</button>
      </div>
      <div class="status" id="rawOut" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h3>Presets / Source</h3>
      <div class="row3">
        <button disabled>1</button><button disabled>2</button><button disabled>3</button>
      </div>
      <div class="row3" style="margin-top:10px;">
        <button disabled>4</button><button disabled>5</button><button disabled>6</button>
      </div>
      <label style="margin-top:10px;">Source</label>
      <select id="sourceSel" disabled>
        <option>Loading…</option>
      </select>
    </div>

    <div class="card">
      <h3>Last Request</h3>
      <div class="status" id="lastUrl"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const $ = id => document.getElementById(id);

  function loadPrefs() {
    $("host").value = localStorage.getItem("duetto_host") || "192.168.68.70";
    $("pin").value = localStorage.getItem("duetto_pin") || "1234";
  }

  function savePrefs() {
    localStorage.setItem("duetto_host", $("host").value.trim());
    localStorage.setItem("duetto_pin", $("pin").value.trim());
    toast("Saved");
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 1400);
  }

  function setBanner(msg, good=false) {
    const b = $("banner");
    b.textContent = msg;
    b.className = "banner " + (good ? "ok" : "bad");
  }

  function bust(url) {
    return url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
  }

  function buildUrl(path) {
    const host = $("host").value.trim();
    const pin = encodeURIComponent($("pin").value.trim() || "1234");
    const sep = path.includes("?") ? "&" : "?";
    return `http://${host}${path}${sep}pin=${pin}`;
  }

  function showLast(method, url, msg="") {
    $("lastUrl").textContent = `${method} ${url}\n${msg}`;
  }

  function showRaw(msg) {
    $("rawOut").textContent = msg;
  }

  function parseValue(xml) {
    if (!xml) return "";
    const m = xml.match(/<[^>]+>(.*?)<\/[^>]+>/s);
    return m ? m[1].trim() : xml.trim();
  }

  function pingUrl(url, okMsg, failMsg) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => { resolve(true); };
      img.onerror = () => { resolve(false); };
      img.src = bust(url);
      setTimeout(() => resolve(false), 5000);
    });
  }

  async function apiGet(path) {
    const url = buildUrl(path);
    showLast("GET", url);
    const ok = await pingUrl(url);
    if (ok) return true;
    return false;
  }

  async function apiSet(path) {
    const url = buildUrl(path);
    showLast("SET", url, "Sent via image fallback");
    await pingUrl(url);
    return true;
  }

  async function refreshStatus() {
    const host = $("host").value.trim();
    const pin = encodeURIComponent($("pin").value.trim() || "1234");

    const powerUrl = bust(`http://${host}/fsapi/GET/netRemote.sys.power?pin=${pin}`);
    const volUrl = bust(`http://${host}/fsapi/GET/netRemote.sys.audio.volume?pin=${pin}`);

    $("connOut").textContent = `Power URL:\n${powerUrl}\n\nVolume URL:\n${volUrl}`;

    const p1 = fetch(powerUrl, { cache: "no-store", mode: "cors" })
      .then(r => r.text())
      .then(t => {
        const v = parseValue(t);
        $("powerState").textContent = v === "1" ? "on" : v === "0" ? "off" : v;
        return true;
      }).catch(() => false);

    const p2 = fetch(volUrl, { cache: "no-store", mode: "cors" })
      .then(r => r.text())
      .then(t => {
        const v = parseInt(parseValue(t), 10);
        if (!Number.isNaN(v)) {
          $("vol").value = v;
          $("volVal").textContent = v;
        }
        return true;
      }).catch(() => false);

    const [ok1, ok2] = await Promise.all([p1, p2]);
    setBanner(ok1 || ok2 ? "Connected." : "No response.", ok1 || ok2);
  }

  async function powerOn() {
    const host = $("host").value.trim();
    const pin = encodeURIComponent($("pin").value.trim() || "1234");

    const probe = bust(`http://${host}/fsapi/GET/netRemote.sys.power?pin=${pin}`);
    showLast("GET", probe, "Probing power");
    new Image().src = probe;

    setTimeout(() => {
      const url = bust(`http://${host}/fsapi/SET/netRemote.sys.power?value=1&pin=${pin}`);
      showLast("SET", url, "Power on sent");
      new Image().src = url;
      setTimeout(refreshStatus, 1200);
    }, 300);
  }

  async function powerOff() {
    const host = $("host").value.trim();
    const pin = encodeURIComponent($("pin").value.trim() || "1234");
    const url = bust(`http://${host}/fsapi/SET/netRemote.sys.power?value=0&pin=${pin}`);
    showLast("SET", url, "Power off sent");
    new Image().src = url;
    setTimeout(refreshStatus, 1200);
  }

  async function setVolume(v) {
    v = Math.max(0, Math.min(40, v|0));
    $("vol").value = v;
    $("volVal").textContent = v;
    const url = bust(`http://${$("host").value.trim()}/fsapi/SET/netRemote.sys.audio.volume?value=${v}&pin=${encodeURIComponent($("pin").value.trim() || "1234")}`);
    showLast("SET", url, `Volume ${v}`);
    new Image().src = url;
  }

  async function muteToggle() {
    const isMuted = $("muteBtn").dataset.state === "1";
    const v = isMuted ? ($("muteBtn").dataset.prev || 17) : 0;
    if (!isMuted) $("muteBtn").dataset.prev = $("vol").value;
    $("muteBtn").dataset.state = isMuted ? "0" : "1";
    $("muteBtn").textContent = isMuted ? "Mute" : "Unmute";
    await setVolume(v);
  }

  function rawPath() {
    return $("rawIn").value.trim();
  }

  async function sendRaw(method) {
    const p = rawPath();
    if (!p.startsWith("/")) {
      showRaw("Path must start with /");
      return;
    }
    const url = bust(`http://${$("host").value.trim()}${p}${p.includes("?") ? "&" : "?"}pin=${encodeURIComponent($("pin").value.trim() || "1234")}`);
    showLast(method, url, "Raw request");
    showRaw(url);
    new Image().src = url;
  }

  $("saveBtn").onclick = () => { savePrefs(); refreshStatus(); };
  $("testBtn").onclick = () => { window.location.href = `http://${$("host").value.trim()}/web/index.html`; };
  $("onBtn").onclick = powerOn;
  $("offBtn").onclick = powerOff;
  $("vol").oninput = e => $("volVal").textContent = e.target.value;
  $("vol").onchange = e => setVolume(e.target.value);
  $("volUp").onclick = () => setVolume(parseInt($("vol").value, 10) + 1);
  $("volDown").onclick = () => setVolume(parseInt($("vol").value, 10) - 1);
  $("muteBtn").onclick = muteToggle;
  $("rawGet").onclick = () => sendRaw("GET");
  $("rawSet").onclick = () => sendRaw("SET");

  loadPrefs();
  refreshStatus();
  setInterval(refreshStatus, 5000);
</script>
</body>
</html>
