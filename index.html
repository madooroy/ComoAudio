<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Como Audio Duetto Control</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; max-width: 520px; }
    .btn, input[type="range"] { width: 100%; display: block; box-sizing: border-box; }
    .row { margin: 16px 0; }
    .status { padding: 10px; background: #f3f3f3; border-radius: 8px; text-align: center; color: #666; font-size: 14px;}
    
    /* Styling standard links to look exactly like your old buttons */
    .btn { 
      padding: 12px; 
      background: #0070f3; 
      color: white; 
      text-align: center; 
      text-decoration: none; 
      border-radius: 6px; 
      font-weight: bold;
      font-size: 16px;
    }
    .btn:active { background: #0051b3; }
    .btn-red { background: #e00; }
    .btn-red:active { background: #b00; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>
  <h1>Como Audio Duetto</h1>

  <div class="row status">
    📱 Remote App Mode (GitHub Pages Bypass Active)
  </div>

  <!-- The slider updates its live display text locally, then fires the command inside the hidden frame -->
  <div class="row">
    <label for="volume">Volume: <span id="volumeValue">20</span></label>
    <input id="volume" type="range" min="0" max="40" value="20" />
  </div>

  <!-- Links targeting the hidden iframe act as immediate buttons -->
  <div class="row buttons">
    <a href="http://192.168.68" target="hidden_frame" class="btn">Power On</a>
    <a href="http://192.168.68" target="hidden_frame" class="btn btn-red">Power Off</a>
  </div>

  <!-- Hidden iframe that swallows the radio's HTTP responses silently -->
  <iframe name="hidden_frame" id="hidden_frame" style="display:none;"></iframe>

<script>
  const BASE = "http://192.168.68.72";
  const volSlider = document.getElementById("volume");
  const volValue = document.getElementById("volumeValue");
  const hiddenFrame = document.getElementById("hidden_frame");

  let volumeTimer = null;

  volSlider.addEventListener("input", () => {
    // 1. Immediately update the number on screen so it feels responsive
    volValue.textContent = volSlider.value;
    
    // 2. Debounce the command so it doesn't spam the hidden frame while dragging
    clearTimeout(volumeTimer);
    volumeTimer = setTimeout(() => {
      const v = volSlider.value;
      // 3. Change the location of the hidden iframe to force the network call
      hiddenFrame.src = `${BASE}/fsapi/SET/netRemote.sys.audio.volume?pin=1234&value=${v}`;
    }, 200);
  });
</script>
</body>
</html>
