<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Como Audio Duetto Controller</title>
  <style>
    :root{
      --bg:#0b1220; --card:#121a2a; --muted:#8ea0c2; --text:#e9eefb;
      --accent:#5eead4; --accent2:#60a5fa; --danger:#fb7185; --ok:#34d399;
      --line:#22304d; --btn:#1b2740; --btn2:#24365a;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#09101d,#0b1220 30%,#050814);
      color:var(--text);
    }
    .wrap{max-width:900px; margin:0 auto; padding:16px}
    .topbar{
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      margin-bottom:14px; flex-wrap:wrap;
    }
    h1{font-size:20px; margin:0}
    .status{
      display:flex; gap:8px; align-items:center; padding:10px 12px; border:1px solid var(--line);
      background:rgba(18,26,42,.9); border-radius:12px; min-width:280px;
    }
    .dot{width:10px; height:10px; border-radius:50%; background:#64748b}
    .dot.ok{background:var(--ok)}
    .dot.bad{background:var(--danger)}
    .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:12px}
    .card{
      grid-column:span 12;
      background:rgba(18,26,42,.92); border:1px solid var(--line); border-radius:16px;
      padding:14px;
    }
    @media (min-width:760px){
      .half{grid-column:span 6}
      .third{grid-column:span 4}
    }
    .label{display:block; color:var(--muted); font-size:12px; margin-bottom:6px}
    input,button,select,textarea{
      width:100%; border-radius:12px; border:1px solid var(--line);
      background:#0f1726; color:var(--text); padding:12px 12px; font-size:15px;
    }
    textarea{min-height:90px; resize:vertical}
    button{
      cursor:pointer; background:var(--btn); transition:.15s transform,.15s background;
    }
    button:hover{background:var(--btn2)}
    button:active{transform:translateY(1px)}
    .row{display:flex; gap:10px; flex-wrap:wrap}
    .row > *{flex:1 1 120px}
    .btn-danger{background:#3a1720}
    .btn-danger:hover{background:#532131}
    .btn-ok{background:#123426}
    .btn-ok:hover{background:#184434}
    .btn-accent{background:#12304a}
    .btn-accent:hover{background:#183a5a}
    .big{
      font-size:18px; padding:16px 14px; font-weight:700;
    }
    .slider-wrap{display:flex; gap:12px; align-items:center}
    input[type="range"]{padding:0; height:42px}
    .value-pill{
      min-width:72px; text-align:center; padding:10px 12px; border-radius:999px;
      background:#0f1726; border:1px solid var(--line); font-variant-numeric:tabular-nums;
    }
    .muted{color:var(--muted)}
    .small{font-size:12px}
    .toast{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background:#0f1726; border:1px solid var(--line); color:var(--text);
      padding:12px 14px; border-radius:12px; opacity:0; pointer-events:none;
      transition:.2s opacity,.2s transform; max-width:min(92vw,680px);
    }
    .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
    .toast.ok{border-color:#1f6f55}
    .toast.bad{border-color:#7f1d1d}
    .pill{
      display:inline-block; padding:4px 8px; border-radius:999px; background:#0f1726;
      border:1px solid var(--line); font-size:12px; color:var(--muted)
    }
    .sep{height:1px; background:var(--line); margin:12px 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Como Audio Duetto Controller</h1>
      <div class="status" id="statusBox">
        <div class="dot" id="statusDot"></div>
        <div>
          <div id="statusText">Disconnected</div>
          <div class="small muted" id="statusSub">Ready</div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card half">
        <span class="label">Connection</span>
        <div class="row">
          <div>
            <span class="label">Host IP</span>
            <input id="host" placeholder="192.168.68.70" />
          </div>
          <div>
            <span class="label">PIN</span>
            <input id="pin" placeholder="1234" />
          </div>
        </div>
        <div style="height:10px"></div>
        <div class="row">
          <button class="btn-accent" id="saveCfg">Save Settings</button>
          <button id="testConn">Test Connection</button>
        </div>
        <div style="height:8px"></div>
        <div class="small muted">API base: <span class="pill" id="baseUrl"></span></div>
      </div>

      <div class="card half">
        <span class="label">Power</span>
        <div class="row">
          <button class="big btn-ok" id="powerOn">Power On</button>
          <button class="big btn-danger" id="powerOff">Power Off</button>
        </div>
        <div style="height:10px"></div>
        <div class="row">
          <div><span class="label">Current Power</span><div class="value-pill" id="powerState">?</div></div>
          <div><span class="label">Current Mode</span><div class="value-pill" id="modeState">?</div></div>
        </div>
      </div>

      <div class="card">
        <span class="label">Volume</span>
        <div class="slider-wrap">
          <button id="volDown" style="width:56px">−</button>
          <input id="volume" type="range" min="0" max="40" step="1" value="0" />
          <button id="volUp" style="width:56px">+</button>
          <div class="value-pill" id="volValue">0</div>
        </div>
        <div style="height:10px"></div>
        <div class="row">
          <button id="muteToggle">Mute / Unmute</button>
          <button id="setVolBtn" class="btn-accent">Set Volume</button>
        </div>
      </div>

      <div class="card half">
        <span class="label">Source</span>
        <div class="row">
          <select id="sourceSelect"></select>
          <button id="refreshModes">Refresh Modes</button>
        </div>
        <div style="height:8px"></div>
        <div class="small muted">Uses <code>netRemote.sys.caps.validModes</code> if available.</div>
      </div>

      <div class="card half">
        <span class="label">Presets</span>
        <div class="row" id="presetButtons"></div>
      </div>

      <div class="card">
        <span class="label">Raw Command</span>
        <textarea id="rawCmd" placeholder="GET/netRemote.sys.info.version"></textarea>
        <div style="height:10px"></div>
        <div class="row">
          <button id="sendRaw" class="btn-accent">Send</button>
          <button id="clearRaw">Clear</button>
        </div>
        <div style="height:10px"></div>
        <pre id="rawOut" class="small" style="white-space:pre-wrap; margin:0; color:#c7d2fe;"></pre>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = {
    host: localStorage.getItem("duetto_host") || "192.168.68.70",
    pin: localStorage.getItem("duetto_pin") || "1234",
    muteBackup: null,
    pollTimer: null,
    modesLoaded: false
  };

  const MODE_MAP = {
    "1":"Radio",
    "2":"DAB",
    "3":"FM",
    "4":"Bluetooth",
    "5":"Line In",
    "6":"Spotify",
    "7":"Network"
  };

  function setStatus(ok, text, sub="") {
    $("statusDot").className = "dot " + (ok ? "ok" : "bad");
    $("statusText").textContent = text;
    $("statusSub").textContent = sub;
  }

  function toast(msg, ok=true) {
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast show " + (ok ? "ok" : "bad");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.className = "toast", 2200);
  }

  function baseUrl() {
    return `http://${state.host}/fsapi`;
  }

  function apiUrl(op, node, extra = "") {
    const key = extra ? `/${extra}` : "";
    return `${baseUrl()}/${op}/${node}${key}?pin=${encodeURIComponent(state.pin)}&_=${Date.now()}`;
  }

  function parseValue(xml) {
    const m = xml.match(/<(?:u8|u16|u32|s8|s16|s32|string|c8_array|bool)>([\s\S]*?)<\/(?:u8|u16|u32|s8|s16|s32|string|c8_array|bool)>/i);
    return m ? m[1].trim() : "";
  }

  async function fetchText(url, opts={}) {
    const res = await fetch(url, {
      mode: "cors",
      cache: "no-store",
      ...opts
    });
    return await res.text();
  }

  async function callApi(op, node, extra="") {
    const url = apiUrl(op, node, extra);
    const txt = await fetchText(url);
    return txt;
  }

  async function getValue(node) {
    return parseValue(await callApi("GET", node));
  }

  async function setValue(node, value) {
    return await callApi("SET", node, "",);
  }

  async function setNodeValue(node, value) {
    const url = `${baseUrl()}/SET/${node}?value=${encodeURIComponent(value)}&pin=${encodeURIComponent(state.pin)}&_=${Date.now()}`;
    const txt = await fetchText(url);
    return txt;
  }

  function saveSettings() {
    state.host = $("host").value.trim() || state.host;
    state.pin = $("pin").value.trim() || state.pin;
    localStorage.setItem("duetto_host", state.host);
    localStorage.setItem("duetto_pin", state.pin);
    $("baseUrl").textContent = baseUrl();
    toast("Settings saved");
  }

  async function testConnection() {
    saveSettings();
    try {
      const txt = await getValue("netRemote.sys.info.version");
      $("rawOut").textContent = txt;
      setStatus(true, "Connected", "Firmware: " + txt);
      toast("Connection OK");
      await refreshStatus();
    } catch (e) {
      setStatus(false, "Disconnected", String(e.message || e));
      toast("Connection failed", false);
    }
  }

  async function refreshStatus() {
    try {
      const [p, v, m] = await Promise.all([
        getValue("netRemote.sys.power"),
        getValue("netRemote.sys.audio.volume"),
        getValue("netRemote.sys.mode")
      ]);
      $("powerState").textContent = p === "1" ? "On" : "Off";
      $("volume").value = v || 0;
      $("volValue").textContent = v || 0;
      $("modeState").textContent = MODE_MAP[m] || m || "?";
      setStatus(true, "Connected", "Last update " + new Date().toLocaleTimeString());
    } catch (e) {
      setStatus(false, "Disconnected", "Polling failed");
    }
  }

  async function refreshModes() {
    try {
      const txt = await callApi("GET", "netRemote.sys.caps.validModes");
      const nums = [...txt.matchAll(/<u8>(\d+)<\/u8>/g)].map(x => x[1]);
      const sel = $("sourceSelect");
      sel.innerHTML = "";
      const options = nums.length ? nums : Object.keys(MODE_MAP);
      options.forEach(v => {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = MODE_MAP[v] || `Mode ${v}`;
        sel.appendChild(o);
      });
      state.modesLoaded = true;
      toast("Modes loaded");
    } catch {
      const sel = $("sourceSelect");
      sel.innerHTML = "";
      Object.keys(MODE_MAP).forEach(v => {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = MODE_MAP[v];
        sel.appendChild(o);
      });
      toast("Using fallback modes");
    }
  }

  async function changePower(v) {
    saveSettings();
    const txt = await setNodeValue("netRemote.sys.power", v);
    $("rawOut").textContent = txt;
    toast(v === 1 ? "Power on sent" : "Power off sent");
    await refreshStatus();
  }

  async function changeVolume(v) {
    saveSettings();
    const vol = Math.max(0, Math.min(40, Number(v)));
    $("volume").value = vol;
    $("volValue").textContent = vol;
    const txt = await setNodeValue("netRemote.sys.audio.volume", vol);
    $("rawOut").textContent = txt;
    toast("Volume set to " + vol);
    await refreshStatus();
  }

  async function toggleMute() {
    const current = Number($("volume").value || 0);
    if (state.muteBackup === null) {
      state.muteBackup = current || 20;
      await changeVolume(0);
      toast("Muted");
    } else {
      await changeVolume(state.muteBackup);
      state.muteBackup = null;
      toast("Unmuted");
    }
  }

  async function sendRaw() {
    saveSettings();
    let cmd = $("rawCmd").value.trim();
    if (!cmd) return;
    if (!/^https?:\/\//i.test(cmd)) {
      cmd = `${baseUrl()}/${cmd}&pin=${encodeURIComponent(state.pin)}&_=${Date.now()}`;
      cmd = cmd.replace(/&&/g, "&");
    }
    try {
      const txt = await fetchText(cmd);
      $("rawOut").textContent = txt;
      toast("Command sent");
    } catch (e) {
      $("rawOut").textContent = String(e.message || e);
      toast("Command failed", false);
    }
  }

  function buildPresets() {
    const box = $("presetButtons");
    box.innerHTML = "";
    for (let i = 1; i <= 6; i++) {
      const b = document.createElement("button");
      b.textContent = "Preset " + i;
      b.addEventListener("click", () => {
        $("rawCmd").value = `SET/netRemote.nav.presets?value=${i}`;
        sendRaw();
      });
      box.appendChild(b);
    }
  }

  $("host").value = state.host;
  $("pin").value = state.pin;
  $("baseUrl").textContent = baseUrl();

  $("saveCfg").addEventListener("click", saveSettings);
  $("testConn").addEventListener("click", testConnection);
  $("powerOn").addEventListener("click", () => changePower(1));
  $("powerOff").addEventListener("click", () => changePower(0));
  $("setVolBtn").addEventListener("click", () => changeVolume($("volume").value));
  $("volume").addEventListener("input", () => $("volValue").textContent = $("volume").value);
  $("volDown").addEventListener("click", () => changeVolume(Number($("volume").value) - 1));
  $("volUp").addEventListener("click", () => changeVolume(Number($("volume").value) + 1));
  $("muteToggle").addEventListener("click", toggleMute);
  $("refreshModes").addEventListener("click", refreshModes);
  $("sendRaw").addEventListener("click", sendRaw);
  $("clearRaw").addEventListener("click", () => { $("rawCmd").value = ""; $("rawOut").textContent = ""; });

  buildPresets();
  refreshModes();
  testConnection();
  state.pollTimer = setInterval(refreshStatus, 5000);
})();
</script>
</body>
</html>
