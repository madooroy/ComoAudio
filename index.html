<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Duetto Controller</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #007AFF;
      --accent-hover: #005bb5;
      --text-main: #ffffff;
      --text-dim: #a0a0a0;
      --input-bg: #2c2c2c;
      --border-color: #333;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main);
      max-width: 600px; 
      margin: 0 auto; 
      padding: 2rem 1rem; 
    }

    h1 { 
      text-align: center; 
      font-weight: 300; 
      letter-spacing: 1px; 
      margin-bottom: 2rem; 
    }

    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 20px; 
      padding: 1.5rem; 
      margin-bottom: 1.5rem; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }

    .row { 
      margin-bottom: 1.5rem; 
    }

    .row:last-child { 
      margin-bottom: 0; 
    }

    label { 
      display: block; 
      margin-bottom: .75rem; 
      font-weight: 500; 
      color: var(--text-dim); 
      font-size: 0.9rem; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], select { 
      width: 100%; 
      box-sizing: border-box; 
      padding: .8rem; 
      background: var(--input-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 10px; 
      color: white; 
      font-size: 1rem;
    }

    input[type="range"] { 
      width: 100%; 
      height: 6px;
      background: var(--input-bg);
      border-radius: 5px;
      outline: none;
      accent-color: var(--accent-color);
    }

    button { 
      cursor: pointer;
      background: var(--accent-color); 
      color: white; 
      border: none; 
      border-radius: 12px; 
      padding: .8rem 1.2rem; 
      font-weight: 600; 
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    button:hover { 
      background: var(--accent-hover); 
      transform: translateY(-1px);
    }

    button:active { 
      transform: translateY(0); 
    }

    .power-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: center;
    }

    #powerOff {
      background: #ff3b30;
    }
    #powerOff:hover {
      background: #d32f2f;
    }

    .preset-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: .75rem; 
    }

    .preset-grid button {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
    }

    .preset-grid button:hover {
      background: #3d3d3d;
    }

    pre { 
      background: #000; 
      color: #00ff00; 
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      padding: 1rem; 
      border-radius: 10px; 
      font-size: 0.85rem; 
      overflow: auto; 
      border: 1px solid var(--border-color);
    }

    .inline { display: flex; gap: .75rem; align-items: center; }
    .small { color: var(--text-dim); font-size: .85rem; margin-top: 0.5rem; display: block; }
  </style>
</head>
<body>
  <h1>Duetto Controller</h1>

  <div class="card"> <!-- Keep this line! It creates the dark box -->
    <div class="row">
      <label>System Power</label>
      <div class="power-group">
        <button id="powerOn">Power On</button>
        <button id="powerOff">Power Off</button>
      </div>
      <span class="small" id="powerState">Power: —</span>
    </div>

    <div class="row">
      <label for="volume">Volume: <span id="volumeValue">—</span></label>
      <input id="volume" type="range" min="0" max="40" value="17" />
      <div class="small">Current volume: <span id="currentVolume">—</span></div>
    </div>
  </div> <!-- This closes the card -->

  <div class="card">
    <div class="row">
      <label>Presets</label>
      <div class="preset-grid" id="presetButtons"></div>
      <div class="small">Hook these to the real preset node once discovered.</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label for="sourceSelect">Source</label>
      <select id="sourceSelect">
        <option value="">— choose source —</option>
        <option value="radio">Radio</option>
        <option value="dab">DAB</option>
        <option value="fm">FM</option>
        <option value="bluetooth">Bluetooth</option>
        <option value="linein">Line In</option>
        <option value="spotify">Spotify</option>
        <option value="network">Network</option>
      </select>
      <button id="setSource">Set Source</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label for="cmd">Raw command</label>
      <div class="inline">
        <input id="cmd" type="text" placeholder="e.g. GET/netRemote.sys.power" />
        <button id="sendCmd">Send</button>
      </div>
    </div>
    <div class="row">
      <label>Response</label>
      <pre id="output"></pre>
    </div>
  </div>

  <script>
    const HOST = "192.168.68.70";
    const PIN = "1234";
    const BASE = `http://${HOST}/fsapi`;

    const els = {
      output: document.getElementById("output"),
      currentVolume: document.getElementById("currentVolume"),
      volume: document.getElementById("volume"),
      volumeValue: document.getElementById("volumeValue"),
      powerState: document.getElementById("powerState"),
      powerOn: document.getElementById("powerOn"),
      powerOff: document.getElementById("powerOff"),
      sourceSelect: document.getElementById("sourceSelect")
    };

    function show(msg) {
      els.output.textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
    }

    function parseValue(text) {
      const m = text.match(/<value>\s*(?:<u8>|<s16>|<u32>|<string>)?([^<\n\r]+)(?:<\/u8>|<\/s16>|<\/u32>|<\/string>)?\s*<\/value>/i);
      return m ? m[1].trim() : null;
    }

    async function fsapi(path) {
      const url = `${BASE}/${path}${path.includes("?") ? "&" : "?"}pin=${PIN}`;
      const res = await fetch(url, {
        method: "GET",
        cache: "no-store",
        mode: "cors"
      });
      const text = await res.text();
      return { status: res.status, text, url };
    }

    async function refreshStatus() {
      try {
        const [vol, pwr] = await Promise.all([
          fsapi("GET/netRemote.sys.audio.volume"),
          fsapi("GET/netRemote.sys.power")
        ]);

        const v = parseValue(vol.text);
        if (v !== null) {
          els.currentVolume.textContent = v;
          els.volume.value = v;
          els.volumeValue.textContent = v;
        }

        const p = parseValue(pwr.text);
        if (p !== null) {
          const on = p === "1";
          els.powerState.textContent = `Power: ${on ? "On" : "Off"}`;
        }
      } catch (err) {
        show(`refreshStatus ERROR\n${err}`);
      }
    }

    els.powerOn.onclick = async () => {
      const url = `http://${HOST}/fsapi/SET/netRemote.sys.power?pin=${PIN}&value=1`;
      try {
        const res = await fetch(url, {
          method: "GET",
          cache: "no-store",
          mode: "cors"
        });
        const text = await res.text();
        show(`${url}\n${res.status}\n${text}`);
        refreshStatus();
      } catch (err) {
        show(`${url}\nERROR\n${err}`);
      }
    };

    els.powerOff.onclick = async () => {
      const url = `http://${HOST}/fsapi/SET/netRemote.sys.power?pin=${PIN}&value=0`;
      try {
        const res = await fetch(url, {
          method: "GET",
          cache: "no-store",
          mode: "cors"
        });
        const text = await res.text();
        show(`${url}\n${res.status}\n${text}`);
        refreshStatus();
      } catch (err) {
        show(`${url}\nERROR\n${err}`);
      }
    };

    els.volume.oninput = () => {
      els.volumeValue.textContent = els.volume.value;
    };

    els.volume.onchange = async () => {
      try {
        const r = await fsapi(`SET/netRemote.sys.audio.volume?value=${els.volume.value}`);
        show(`${r.url}\n${r.status}\n${r.text}`);
        refreshStatus();
      } catch (err) {
        show(`volume ERROR\n${err}`);
      }
    };

    document.getElementById("sendCmd").onclick = async () => {
      const cmd = document.getElementById("cmd").value.trim();
      if (!cmd) return;
      try {
        const r = await fsapi(cmd);
        show(`${r.url}\n${r.status}\n${r.text}`);
      } catch (err) {
        show(`raw command ERROR\n${err}`);
      }
    };

    document.getElementById("setSource").onclick = async () => {
      const source = els.sourceSelect.value;
      if (!source) return;
      show(`Source command for "${source}" not wired yet.`);
    };

    for (let i = 1; i <= 6; i++) {
      const b = document.createElement("button");
      b.textContent = `Preset ${i}`;
      b.onclick = () => show(`Preset ${i} command not wired yet.`);
      document.getElementById("presetButtons").appendChild(b);
    }

    refreshStatus();
    setInterval(refreshStatus, 5000);
  </script>
</body>
</html>
