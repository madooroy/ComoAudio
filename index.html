<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Como Audio Duetto Control</title>

<!-- iPhone home-screen app: full-screen, dark status bar, custom name and icon -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Duetto" />
<meta name="theme-color" content="#0b0f14" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<style>
  :root{
    --bg:#0b0f14; --card:#121824; --card2:#171f2d; --text:#e8eef7; --muted:#93a4bb;
    --accent:#4da3ff; --good:#3ddc97; --bad:#ff6b6b; --line:#243246; --glow:0 10px 30px rgba(0,0,0,.35);
    --heart:#ff5c8a;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--text);
    background:radial-gradient(1200px 700px at 20% 0%, #122036 0%, var(--bg) 55%);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px;margin:0 auto;
    padding:max(20px, calc(env(safe-area-inset-top) + 8px)) max(20px, env(safe-area-inset-right))
            max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left))}
  /* Solid strip behind the clock/battery so scrolled content never shows through it */
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);
    background:var(--bg);z-index:10;pointer-events:none}
  .app{
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line); border-radius:20px; box-shadow:var(--glow);
    padding:18px;
  }
  h1{margin:0;font-size:20px}
  h2{margin:0 0 8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  button{
    appearance:none; border:none; border-radius:14px; padding:14px 12px; font-weight:700; font-size:16px;
    color:#fff; background:#243246; cursor:pointer; transition:.15s transform,.15s opacity,.15s background, .15s box-shadow;
    flex:1 1 0; font-family:inherit;
    touch-action:manipulation; /* no double-tap zoom on iPhone */
  }
  button:active{transform:scale(.98)}
  button.active{
    outline:5px solid rgba(255,255,255,.42);
    box-shadow:0 0 0 3px rgba(0,0,0,.25) inset, 0 0 18px rgba(77,163,255,.45);
  }
  button.primary{background:linear-gradient(180deg,#4da3ff,#2f7fe0)}
  button.good{background:linear-gradient(180deg,#3ddc97,#1f9f67)}
  button.warn{background:linear-gradient(180deg,#ffb84d,#d98a1f)}
  button.purple{background:linear-gradient(180deg,#9b7bff,#6f4de0)}
  button.teal{background:linear-gradient(180deg,#35c9c9,#1d8f8f)}
  button.olive{background:linear-gradient(180deg,#a3c95a,#6f9630)}
  button.power.off{background:linear-gradient(180deg,#3ddc97,#1f9f67)}
  button.power.on{background:linear-gradient(180deg,#ff6b6b,#d83a3a)}
  #btnMute.active{background:linear-gradient(180deg,#ffb84d,#d98a1f)}
  .panel{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
  input[type="range"]{width:100%}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}

  /* Connection status */
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .status.ok .dot{background:var(--good)}
  .status.err{color:var(--bad)}
  .status.err .dot{background:var(--bad)}

  /* Now playing */
  #now{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  #art{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#0e141e;border:1px solid var(--line)}
  #art[hidden]{display:none}
  #now .text{flex:1;min-width:0}
  #nowLabel{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #nowMain{font-size:19px;font-weight:700;margin-top:2px;overflow:hidden;line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}
  #nowSub{font-size:14px;color:var(--muted);margin-top:2px;min-height:1.3em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  #heart{flex:none;width:46px;height:46px;padding:0;border-radius:50%;background:none;display:grid;place-items:center}
  #heart svg{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linejoin:round;transition:fill .15s, stroke .15s}
  #heart[aria-pressed="true"] svg{fill:var(--heart);stroke:var(--heart)}
  #heart:disabled{cursor:default}
  #heart:disabled svg{opacity:.3}

  /* Presets */
  #presetList{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,8.5em),1fr));gap:8px}
  .preset{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 8px;font-size:15px;line-height:1.2;min-height:58px;
    background:#1c2636;border:1px solid var(--line);min-width:0}
  .preset .num{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid #3a4a62;color:var(--muted);
    font-size:12px;display:grid;place-items:center}
  .preset .name{min-width:0;overflow:hidden;overflow-wrap:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .preset.on{background:linear-gradient(180deg,#4da3ff,#2f7fe0);border-color:transparent}
  .preset.on .num{border-color:#fff;color:#fff}
  .hint{font-size:13px;color:var(--muted);margin:6px 0 0}

  /* Favorites view */
  .back{flex:none;background:none;color:var(--accent);padding:6px 0;font-size:16px}
  .fav{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  .fav:first-child{border-top:0}
  .fav .what{flex:1;min-width:0}
  .fav .song{font-weight:700;overflow-wrap:anywhere}
  .fav small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .fav a{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:999px;background:#1db954;color:#fff;
    font-size:14px;font-weight:700;text-decoration:none}
  .fav .del{flex:none;width:40px;height:40px;padding:0;border-radius:10px;background:none;border:1px solid var(--line);
    color:var(--muted);font-size:16px}

  @media (max-width:360px){
    .wrap{padding-left:max(8px, env(safe-area-inset-left));padding-right:max(8px, env(safe-area-inset-right))}
    .app{padding:14px;border-radius:16px}
    #art{width:52px;height:52px}
    button{padding:12px 8px}
    .preset{padding:10px 8px}
  }
  /* Station browser */
  #btnBrowse{width:100%;margin-top:14px;background:#1c2636;border:1px solid var(--line)}
  .search{display:flex;gap:8px;margin:0 0 12px}
  .search input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:#0e141e;
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;-webkit-appearance:none;appearance:none}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}
  .search button{flex:none;padding:11px 16px;font-size:15px}
  .crumbs{display:flex;align-items:center;gap:10px;min-height:36px;margin-bottom:4px}
  .crumbs .back{padding:6px 0}
  #browsePath{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border-radius:0;
    border-top:1px solid var(--line);padding:14px 4px;font-weight:600;font-size:16px}
  .item:first-child{border-top:0}
  .item:active{transform:none;background:rgba(255,255,255,.04)}
  .item .ic{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;
    background:#1c2636;color:var(--muted)}
  .item.play .ic{background:linear-gradient(180deg,#ffb84d,#d98a1f);color:#fff}
  .item.on .ic{background:linear-gradient(180deg,#4da3ff,#2f7fe0)}
  .item .nm{flex:1;min-width:0;overflow-wrap:break-word}
  .item .go{flex:none;color:var(--muted);font-size:20px;font-weight:400}
  #browseMore{width:100%;margin-top:10px}
  #browseList.busy{opacity:.45;pointer-events:none}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== Main remote ===== -->
  <div class="app" id="main">
    <div class="toprow">
      <h1>Como Audio Duetto</h1>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="dot"></span><span id="statusText">Connecting…</span>
      </div>
    </div>

    <div id="now">
      <img id="art" alt="" hidden />
      <div class="text">
        <div id="nowLabel">—</div>
        <div id="nowMain">—</div>
        <div id="nowSub"></div>
      </div>
      <button id="heart" aria-label="Save this song to Favorites" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1z"/></svg>
      </button>
    </div>

    <div class="grid">
      <button class="primary" id="btnFm">FM Radio</button>
      <button class="good" id="btnSpotify">Spotify</button>
      <button class="warn" id="btnInternetRadio">Internet Radio</button>
      <button class="purple" id="btnBluetooth">Bluetooth</button>
      <button class="teal" id="btnUsb">USB</button>
      <button class="olive" id="btnAux">Aux 1 In</button>
    </div>

    <div class="panel" id="presets" hidden>
      <h2 id="presetTitle">Presets</h2>
      <div id="presetList"></div>
      <p class="hint" id="presetMsg" hidden></p>
    </div>

    <button id="btnBrowse" hidden>🔍 Browse &amp; search stations</button>

    <div class="panel">
      <div class="toprow" style="margin-bottom:8px">
        <div>Volume: <strong id="volLabel">?</strong></div>
        <div>Power: <strong id="powerLabel">?</strong></div>
      </div>
      <!-- Deliberately limited to 5–20. If the knob is turned outside this range,
           the slider sits at the end and the label shows the real value. -->
      <input id="vol" type="range" min="5" max="20" step="1" value="10" aria-label="Volume" />
    </div>

    <div class="row" style="margin-top:14px">
      <button id="btnPower" class="power off">Power</button>
      <button id="btnMute" aria-pressed="false">Mute</button>
    </div>

    <div class="row" style="margin-top:14px">
      <button id="btnFavs">♥ Favorites</button>
      <button id="btnRefresh">Refresh</button>
    </div>
  </div>

  <!-- ===== Favorites ===== -->
  <div class="app" id="favs" hidden>
    <div class="toprow">
      <h1>Favorites</h1>
      <button class="back" id="favsDone">Done</button>
    </div>
    <p class="hint" style="margin:0 0 10px">Songs you saved with the heart, newest first. “Find in Spotify” searches for the song so you can play it or add it to your Liked Songs. Saved on this phone only.</p>
    <div id="favList"></div>
    <p class="hint" id="favMsg"></p>
  </div>

  <!-- ===== Station browser (the radio's own internet radio directory) ===== -->
  <div class="app" id="browse" hidden>
    <div class="toprow">
      <h1>Stations</h1>
      <button class="back" id="browseDone">Done</button>
    </div>
    <form class="search" id="searchForm">
      <input id="searchQ" type="search" placeholder="Search for a station" autocapitalize="off"
             autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
      <button type="submit">Search</button>
    </form>
    <div class="crumbs">
      <button class="back" id="browseBack" hidden>‹ Back</button>
      <span id="browsePath">All stations</span>
    </div>
    <div id="browseList"></div>
    <button id="browseMore" hidden>Show more</button>
    <p class="hint" id="browseMsg"></p>
  </div>

</div>

<script>
// ---- Settings -------------------------------------------------------------
const BASE = 'http://192.168.100.102/fsapi';   // radio's reserved IP
const PIN = '1234';
const TIMEOUT_MS = 4000;
const POLL_MS = 10000;     // how often to update "now playing" while the page is open

// Mode numbers as reported by this radio's firmware. If a firmware update ever
// renumbers them, open  BASE + '/LIST_GET_NEXT/netRemote.sys.caps.validModes/-1?pin=1234&maxItems=20'
// in a browser to see the current list.
const MODES = { 0:'btnInternetRadio', 1:'btnSpotify', 3:'btnUsb', 4:'btnFm', 5:'btnBluetooth', 6:'btnAux' };
const MODE_NAMES = { 0:'Internet Radio', 1:'Spotify', 3:'USB', 4:'FM Radio', 5:'Bluetooth', 6:'Aux In' };
const RADIO_MODES = [0, 4];   // sources that have a station name plus song/info text
const PLAY_STATUS = { 1:'Buffering', 3:'Paused', 4:'Buffering', 5:'Error', 6:'Stopped' };   // "Playing" goes without saying

// Everything the page shows, read in one request when the radio supports it.
const NODES = {
  mode:   'netRemote.sys.mode',
  vol:    'netRemote.sys.audio.volume',
  power:  'netRemote.sys.power',
  mute:   'netRemote.sys.audio.mute',
  status: 'netRemote.play.status',
  name:   'netRemote.play.info.name',     // station name (radio) or track title
  text:   'netRemote.play.info.text',     // song / info text (radio)
  artist: 'netRemote.play.info.artist',
  album:  'netRemote.play.info.album',
  art:    'netRemote.play.info.graphicUri'
};

// ---- Elements -------------------------------------------------------------
const $ = id => document.getElementById(id);
const elVol = $('vol');
const elStatus = $('status');
const btnPower = $('btnPower');
const btnMute = $('btnMute');
const btnHeart = $('heart');

let st = {};               // latest values read from the radio
let muteState = false;
let volTimer = null;
let lastVolInput = 0;      // when the slider was last touched
let refreshing = null;     // in-flight refresh, so taps don't stack them up
let holdNoticeUntil = 0;   // keeps a "refused" message visible for a few seconds
let multiOK = true;        // set false if the radio doesn't support GET_MULTIPLE
let presetsFor = null;     // which mode the preset buttons were loaded for

// ---- Status line ----------------------------------------------------------
function setStatus(kind, text){
  if (kind === 'ok' && Date.now() < holdNoticeUntil) return;
  elStatus.classList.toggle('ok', kind === 'ok');
  elStatus.classList.toggle('err', kind === 'err');
  $('statusText').textContent = text;
}

// The radio answered, but refused the request (e.g. FS_FAIL, FS_NODE_BLOCKED).
class RadioError extends Error {}

// ---- Talking to the radio -------------------------------------------------
// Fetches a URL from the radio and returns the parsed XML document.
async function request(path){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  let text;
  try{
    const r = await fetch(BASE + path, { method:'GET', cache:'no-store', mode:'cors', signal:ctrl.signal });
    text = await r.text();
    if (!r.ok) throw new RadioError(`HTTP ${r.status}`);
  }catch(e){
    if (e instanceof RadioError) throw e;
    setStatus('err', e.name === 'AbortError' ? 'Radio not responding' : "Can't reach radio");
    throw e;
  }finally{
    clearTimeout(timer);
  }
  setStatus('ok', 'Connected');
  return new DOMParser().parseFromString(text, 'text/xml');
}

// The status of a response element, e.g. FS_OK.
const statusOf = el => (el.querySelector(':scope > status')?.textContent || '').trim();

// Reads <value><u8>3</u8></value> as a number, <value><c8_array>…</c8_array></value> as text.
function valueOf(el){
  const v = el.querySelector(':scope > value > *');
  if (!v) return undefined;
  return v.tagName.toLowerCase() === 'c8_array' ? v.textContent.trim() : Number(v.textContent);
}

// A request that must come back FS_OK.
async function call(path){
  const doc = await request(path);
  const root = doc.documentElement;
  const s = statusOf(root);
  if (s !== 'FS_OK') throw new RadioError(s || 'unknown reply');
  return root;
}

// Sends a command; reports a refusal in the status line.
async function set(node, value){
  try{
    await call(`/SET/${node}?pin=${PIN}&value=${encodeURIComponent(value)}`);
    return true;
  }catch(e){
    if (e instanceof RadioError){
      setStatus('err', `Radio refused command (${e.message})`);
      holdNoticeUntil = Date.now() + 4000;
    }
    return false;
  }
}

// Reads several settings. Unavailable ones (e.g. "artist" on FM) come back undefined.
// Network failures throw.
async function getMany(keys){
  const out = {};
  if (multiOK){
    try{
      const qs = keys.map(k => 'node=' + NODES[k]).join('&');
      const doc = await request(`/GET_MULTIPLE?pin=${PIN}&${qs}`);
      const items = doc.querySelectorAll('fsapiResponse');
      if (doc.documentElement.tagName !== 'fsapiGetMultipleResponse' || !items.length)
        throw new RadioError('no GET_MULTIPLE');
      for (const it of items){
        const node = it.querySelector(':scope > node')?.textContent.trim();
        const key = keys.find(k => NODES[k] === node);
        if (key && statusOf(it) === 'FS_OK') out[key] = valueOf(it);
      }
      return out;
    }catch(e){
      if (!(e instanceof RadioError)) throw e;
      multiOK = false;   // older firmware: fall back to one request per setting
    }
  }
  for (const k of keys){   // one at a time: these radios dislike simultaneous requests
    try{ out[k] = valueOf(await call(`/GET/${NODES[k]}?pin=${PIN}`)); }
    catch(e){ if (!(e instanceof RadioError)) throw e; }
  }
  return out;
}

// ---- UI updates -----------------------------------------------------------
function setText(id, text){ const el = $(id); if (el.textContent !== text) el.textContent = text; }

function setActiveMode(v){
  for (const id of Object.values(MODES)) $(id).classList.remove('active');
  if (MODES[v]) $(MODES[v]).classList.add('active');
}

function setPower(on){
  $('powerLabel').textContent = on ? 'On' : 'Off';
  btnPower.classList.remove('on', 'off');
  btnPower.classList.add(on ? 'on' : 'off');
}

function setMute(on){
  muteState = on;
  btnMute.classList.toggle('active', on);
  btnMute.textContent = on ? 'Muted' : 'Mute';
  btnMute.setAttribute('aria-pressed', String(on));
}

const isRadio = () => RADIO_MODES.includes(st.mode);

// The song currently shown, as "Artist – Title", or '' when there is nothing to save.
function songShowing(){
  if (!st.power || st.status === 5) return '';
  if (isRadio()) return st.text || '';
  if (st.name) return st.artist ? `${st.artist} – ${st.name}` : st.name;
  return '';
}

// Where the song is playing: the station for radio, otherwise the source.
function sourceShowing(){
  if (isRadio() && st.name) return st.name;
  return MODE_NAMES[st.mode] || '';
}

function renderNow(){
  if (st.power === 0){
    setText('nowLabel', 'Standby'); setText('nowMain', 'Radio is off'); setText('nowSub', '');
  } else {
    const label = [MODE_NAMES[st.mode], PLAY_STATUS[st.status]].filter(Boolean).join(' · ');
    setText('nowLabel', label || '—');
    if (isRadio()){
      setText('nowMain', st.name || MODE_NAMES[st.mode]);
      setText('nowSub', st.text || '');
    } else {
      setText('nowMain', st.name || MODE_NAMES[st.mode] || '—');
      setText('nowSub', [st.artist, st.album].filter(Boolean).join(' · '));
    }
  }
  // Album art or station logo, when the radio provides one.
  const art = $('art');
  const url = st.power && typeof st.art === 'string' && /^https?:\/\//i.test(st.art) ? st.art : '';
  if (!url) art.hidden = true;
  else if (art.getAttribute('src') !== url){ art.hidden = true; art.src = url; }

  const song = songShowing();
  const liked = !!song && favorites().some(f => f.title === song);
  btnHeart.disabled = !song;
  btnHeart.setAttribute('aria-pressed', String(liked));
  btnHeart.setAttribute('aria-label', liked ? 'Remove this song from Favorites' : 'Save this song to Favorites');
  markPlayingPreset();
}
$('art').onload  = () => { $('art').hidden = false; };
$('art').onerror = () => { $('art').hidden = true; };

// ---- Refresh --------------------------------------------------------------
function refresh(){
  if (!refreshing) refreshing = doRefresh().finally(() => { refreshing = null; });
  return refreshing;
}

async function doRefresh(){
  try{
    const v = await getMany(Object.keys(NODES));
    st = v;

    if (v.mode !== undefined) setActiveMode(v.mode);

    // Don't yank the slider out from under a finger that's still moving it.
    if (v.vol !== undefined && Date.now() - lastVolInput > 1500){
      elVol.value = v.vol;
      $('volLabel').textContent = v.vol;
    }

    if (v.power !== undefined) setPower(!!v.power);
    if (v.mute !== undefined) setMute(!!v.mute);
    renderNow();

    // Presets belong to a source, so reload them when the source changes.
    if (v.power && v.mode !== undefined && v.mode !== presetsFor) loadPresets(v.mode);
    if (!v.power) $('presets').hidden = true;
    $('btnBrowse').hidden = !(v.power && v.mode === 0);
  }catch(e){
    // Status line already says what went wrong.
  }
}

// ---- Presets --------------------------------------------------------------
// The radio keeps a separate preset list for each source (Internet Radio, FM).
function cachedPresets(mode){
  try{ return JSON.parse(localStorage.getItem('duetto.presets.' + mode)) || null; }catch(e){ return null; }
}

function showPresets(mode, list){
  const box = $('presetList');
  box.textContent = '';
  $('presets').hidden = !list || !list.length;
  if (!list || !list.length) return;
  setText('presetTitle', `${MODE_NAMES[mode] || 'Radio'} presets`);
  for (const p of list){
    const b = document.createElement('button');
    b.className = 'preset';
    b.dataset.name = p.name;
    const n = document.createElement('span'); n.className = 'num'; n.textContent = p.key + 1;
    const t = document.createElement('span'); t.className = 'name'; t.textContent = p.name;
    b.append(n, t);
    b.onclick = () => playPreset(p, b);
    box.append(b);
  }
  markPlayingPreset();
}

// Highlights the preset whose name matches the station playing now.
function markPlayingPreset(){
  const name = (st.power && isRadio() && st.name || '').toLowerCase();
  for (const b of $('presetList').children)
    b.classList.toggle('on', !!name && b.dataset.name.toLowerCase() === name);
}

async function loadPresets(mode){
  presetsFor = mode;
  if (!RADIO_MODES.includes(mode)){ showPresets(mode, null); return; }
  showPresets(mode, cachedPresets(mode));   // show the last known list straight away
  // Right after a source change the radio can need a moment, so try twice.
  for (let attempt = 0; attempt < 2; attempt++){
    if (attempt) await new Promise(r => setTimeout(r, 1500));
    if (presetsFor !== mode) return;        // source changed again meanwhile
    try{
      await call(`/SET/netRemote.nav.state?pin=${PIN}&value=1`);
      const root = await call(`/LIST_GET_NEXT/netRemote.nav.presets/-1?pin=${PIN}&maxItems=40`);
      const list = [];
      for (const item of root.querySelectorAll(':scope > item')){
        const name = (item.querySelector('field[name="name"] c8_array')?.textContent || '').trim();
        const key = Number(item.getAttribute('key'));
        if (name && Number.isFinite(key)) list.push({ key, name });
      }
      if (presetsFor !== mode) return;
      try{ localStorage.setItem('duetto.presets.' + mode, JSON.stringify(list)); }catch(e){}
      showPresets(mode, list);
      return;
    }catch(e){
      if (!(e instanceof RadioError)) return;  // radio unreachable; status line says so
    }
  }
}

async function playPreset(p, btn){
  for (const b of $('presetList').children) b.classList.remove('on');
  btn.classList.add('on');
  const ok = await set('netRemote.nav.state', 1) && await set('netRemote.nav.action.selectPreset', p.key);
  if (!ok){ btn.classList.remove('on'); return; }
  // The station name updates once the radio has tuned in.
  setTimeout(refresh, 1500);
  setTimeout(refresh, 4000);
}

// ---- Favorites (stored on this phone) ---------------------------------------
function favorites(){
  try{ return JSON.parse(localStorage.getItem('duetto.favorites')) || []; }catch(e){ return []; }
}
function saveFavorites(list){
  try{ localStorage.setItem('duetto.favorites', JSON.stringify(list)); return true; }
  catch(e){ setStatus('err', "Couldn't save favorite"); holdNoticeUntil = Date.now() + 4000; return false; }
}

btnHeart.onclick = () => {
  const title = songShowing();
  if (!title) return;
  const list = favorites();
  const i = list.findIndex(f => f.title === title);
  if (i >= 0) list.splice(i, 1);
  else list.push({ title, station: sourceShowing(), at: new Date().toISOString() });
  saveFavorites(list);
  renderNow();
};

// "Artist – Song" -> plain words for the Spotify search.
const spotifySearch = title =>
  'https://open.spotify.com/search/' + encodeURIComponent(title.replace(/\s[–—-]\s/g, ' '));

function drawFavorites(){
  const box = $('favList');
  box.textContent = '';
  const list = favorites().sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  $('favMsg').textContent = list.length ? '' : 'Nothing saved yet. While a song is playing, tap the heart next to its name.';
  for (const f of list){
    const row = document.createElement('div'); row.className = 'fav';
    const what = document.createElement('div'); what.className = 'what';
    const song = document.createElement('div'); song.className = 'song'; song.textContent = f.title;
    const when = f.at ? new Date(f.at) : null;
    const meta = document.createElement('small');
    meta.textContent = [f.station, when && !isNaN(when) ? when.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : '']
      .filter(Boolean).join(' · ');
    const link = document.createElement('a');
    link.href = spotifySearch(f.title); link.target = '_blank'; link.rel = 'noopener';
    link.textContent = 'Find in Spotify';
    what.append(song, meta, link);
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label', 'Remove ' + f.title);
    del.onclick = () => {
      saveFavorites(favorites().filter(x => !(x.title === f.title && x.at === f.at)));
      drawFavorites(); renderNow();
    };
    row.append(what, del);
    box.append(row);
  }
}

$('btnFavs').onclick = () => { drawFavorites(); $('main').hidden = true; $('favs').hidden = false; scrollTo(0, 0); };
$('favsDone').onclick = () => { $('favs').hidden = true; $('main').hidden = false; refresh(); };

// ---- Station browser --------------------------------------------------------
// Drives the radio's own internet radio menu (the one on its screen): open
// folders, go back, search, and tap a station to play it.
const NAV_UP = 4294967295;            // "navigate" to this = go up one level
const T_DIR = 0, T_PLAY = 1, T_SEARCH = 2;
const sleep = ms => new Promise(r => setTimeout(r, ms));
let path = [];                        // folder names we're inside, for the Back button
let pageItems = [];                   // items shown so far in this folder
let lastKey = -1;                     // where "Show more" continues from
let busy = false;

const navSet = (node, value) => call(`/SET/${node}?pin=${PIN}&value=${encodeURIComponent(value)}`);
const fieldOf = (it, name) => (it.querySelector(`field[name="${name}"] > *`)?.textContent || '').trim();

// After opening a folder the radio fetches it from its station service; wait until it's ready.
async function waitReady(){
  const until = Date.now() + 15000;
  while (Date.now() < until){
    let s;
    try{ s = valueOf(await call(`/GET/netRemote.nav.status?pin=${PIN}`)); }
    catch(e){ if (e instanceof RadioError){ await sleep(800); return; } throw e; }  // not reported: just give it a moment
    if (s === 1 || s === 4) return;                       // ready
    if (s === 2 || s === 3) throw new RadioError("the station service didn't answer");
    await sleep(400);
  }
  throw new RadioError('the station service is taking too long');
}

async function listFrom(from){
  let root;
  try{ root = await call(`/LIST_GET_NEXT/netRemote.nav.list/${from}?pin=${PIN}&maxItems=40`); }
  catch(e){ if (e instanceof RadioError && /LIST_END/.test(e.message)) return { items:[], end:true }; throw e; }
  const items = [...root.querySelectorAll(':scope > item')].map(it => ({
    key: Number(it.getAttribute('key')), name: fieldOf(it, 'name'), type: Number(fieldOf(it, 'type'))
  })).filter(i => i.name && Number.isFinite(i.key));
  return { items, end: !!root.querySelector(':scope > listend') || !items.length };
}

function drawList(more){
  const box = $('browseList');
  if (!more) box.textContent = '';
  const start = more ? box.children.length : 0;
  for (const it of pageItems.slice(start)){
    const b = document.createElement('button');
    const kind = it.type === T_PLAY ? 'play' : it.type === T_SEARCH ? 'search' : 'dir';
    b.className = 'item ' + kind;
    const ic = document.createElement('span'); ic.className = 'ic';
    ic.textContent = kind === 'play' ? '▶' : kind === 'search' ? '🔍' : '';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = it.name;
    b.append(ic, nm);
    if (kind !== 'play'){ const go = document.createElement('span'); go.className = 'go'; go.textContent = '›'; b.append(go); }
    b.onclick = () => kind === 'play' ? playItem(it, b) : kind === 'search' ? $('searchQ').focus() : guard(() => openFolder(it));
    box.append(b);
  }
}

function drawPath(){
  $('browseBack').hidden = !path.length;
  $('browsePath').textContent = path.length ? path.join(' › ') : 'All stations';
}

async function showFolder(){
  const { items, end } = await listFrom(-1);
  pageItems = items;
  lastKey = items.length ? items[items.length - 1].key : -1;
  drawPath(); drawList(false);
  $('browseMore').hidden = end;
  $('browseMsg').textContent = items.length ? '' : 'Nothing here.';
  scrollTo(0, 0);
}

// Runs one browser action at a time, greying the list while the radio works.
async function guard(fn, label = 'Loading…'){
  if (busy) return;
  busy = true;
  $('browseList').classList.add('busy');
  $('browseMsg').textContent = label;
  try{ await fn(); }
  catch(e){
    $('browseMsg').textContent = e instanceof RadioError
      ? `The radio couldn't do that (${e.message}). Try again, or tap Done and reopen.`
      : "Can't reach the radio.";
  }finally{
    busy = false;
    $('browseList').classList.remove('busy');
  }
}

async function goToTop(){
  try{ await navSet('netRemote.nav.state', 0); }catch(e){ if (!(e instanceof RadioError)) throw e; }
  await navSet('netRemote.nav.state', 1);   // turning navigation on starts at the top menu
  path = [];
  await waitReady();
}

async function openFolder(it){
  await navSet('netRemote.nav.action.navigate', it.key);
  path.push(it.name);
  await waitReady();
  await showFolder();
}

async function playItem(it, btn){
  if (busy) return;
  for (const b of $('browseList').children) b.classList.remove('on');
  btn.classList.add('on');
  await guard(async () => {
    await navSet('netRemote.nav.action.selectItem', it.key);
    $('browseMsg').textContent = `Tuning in to ${it.name}…`;
  }, `Tuning in to ${it.name}…`);
  // Once it's tuned in, confirm what's playing.
  for (const ms of [2500, 6000]) setTimeout(async () => {
    await refresh();
    if (!$('browse').hidden && !busy && st.name) $('browseMsg').textContent = `Now playing: ${st.name}`;
  }, ms);
}

// Finds the directory's search entry: on the top menu, or inside "Stations".
async function findSearch(){
  await goToTop();
  let { items } = await listFrom(-1);
  let s = items.find(i => i.type === T_SEARCH);
  if (s) return s;
  const dir = items.find(i => i.type === T_DIR && /^stations$/i.test(i.name))
           || items.find(i => i.type === T_DIR && /station/i.test(i.name) && !/my|added/i.test(i.name));
  if (!dir) return null;
  await navSet('netRemote.nav.action.navigate', dir.key);
  path.push(dir.name);
  await waitReady();
  ({ items } = await listFrom(-1));
  return items.find(i => i.type === T_SEARCH) || null;
}

async function search(term){
  // Already in a folder with a search entry? Use it; otherwise go find one.
  let s = pageItems.find(i => i.type === T_SEARCH);
  if (!s) s = await findSearch();
  if (!s){
    await showFolder();
    $('browseMsg').textContent = "Couldn't find a search option in the radio's menu. Browse the folders instead.";
    return;
  }
  await navSet('netRemote.nav.searchTerm', term);
  await navSet('netRemote.nav.action.navigate', s.key);
  path.push(`“${term}”`);
  await waitReady();
  await showFolder();
  if (!pageItems.length) $('browseMsg').textContent = `No stations found for “${term}”.`;
}

$('btnBrowse').onclick = () => {
  $('main').hidden = true; $('browse').hidden = false;
  $('browseList').textContent = ''; pageItems = [];
  guard(async () => { await goToTop(); await showFolder(); });
};
$('browseDone').onclick = () => { $('browse').hidden = true; $('main').hidden = false; refresh(); };
$('browseBack').onclick = () => guard(async () => {
  await navSet('netRemote.nav.action.navigate', NAV_UP);
  path.pop();
  await waitReady();
  await showFolder();
});
$('browseMore').onclick = () => guard(async () => {
  const { items, end } = await listFrom(lastKey);
  pageItems = pageItems.concat(items);
  if (items.length) lastKey = items[items.length - 1].key;
  drawList(true);
  $('browseMore').hidden = end;
  $('browseMsg').textContent = '';
});
$('searchForm').onsubmit = e => {
  e.preventDefault();
  const term = $('searchQ').value.trim();
  if (!term) return;
  $('searchQ').blur();   // put the keyboard away
  guard(() => search(term), `Searching for “${term}”…`);
};

// ---- Controls -------------------------------------------------------------
for (const [mode, id] of Object.entries(MODES)){
  $(id).onclick = async () => {
    if (await set('netRemote.sys.mode', mode)) setActiveMode(Number(mode));
    refresh();
  };
}

btnPower.onclick = async () => {
  try{
    // Ask the radio first, in case it was switched on/off by hand.
    const { power } = await getMany(['power']);
    if (power === undefined) return;
    const next = power ? 0 : 1;
    if (await set('netRemote.sys.power', next)) setPower(!!next);
    presetsFor = null;   // presets reload once it's on
    refresh();
  }catch(e){}
};

btnMute.onclick = async () => {
  const next = !muteState;
  if (await set('netRemote.sys.audio.mute', next ? 1 : 0)) setMute(next);
  refresh();
};

$('btnRefresh').onclick = () => { presetsFor = null; refresh(); };

elVol.addEventListener('input', () => {
  lastVolInput = Date.now();
  $('volLabel').textContent = elVol.value;
  clearTimeout(volTimer);
  volTimer = setTimeout(() => set('netRemote.sys.audio.volume', elVol.value), 300);
});

// Catch up when coming back to the page or reopening the home-screen app,
// e.g. after someone changed the volume or source with the knob.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh();
});
window.addEventListener('pageshow', e => { if (e.persisted) refresh(); });

// Keep "now playing" current while the page is on screen.
setInterval(() => {
  if (document.visibilityState === 'visible' && !$('main').hidden) refresh();
}, POLL_MS);

refresh();
</script>
