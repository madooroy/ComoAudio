<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Como Audio Duetto Control</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; max-width: 520px; }
    button, input[type="range"] { width: 100%; }
    .row { margin: 16px 0; }
    .status { padding: 10px; background: #f3f3f3; border-radius: 8px; }
    .small { color: #555; font-size: 14px; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>
  <h1>Como Audio Duetto</h1>

  <div class="row status">
    <div><strong>Power:</strong> <span id="powerState">Loading…</span></div>
    <div><strong>Volume:</strong> <span id="volumeValue">—</span></div>
    <div><strong>Connection:</strong> <span id="connState">—</span></div>
  </div>

  <div class="row">
    <label for="volume">Volume</label>
    <input id="volume" type="range" min="0" max="40" value="0" />
  </div>

  <div class="row buttons">
    <button id="powerOn">Power On</button>
    <button id="powerOff">Power Off</button>
  </div>

  <div class="row">
    <button id="refresh">Refresh</button>
  </div>

  <div class="small" id="msg"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const BASE = "http://192.168.68.72";

  function setMsg(text) {
    $("msg").textContent = text;
  }

  async function fsapi(path) {
    const url = `${BASE}/fsapi/${path}`;
    const res = await fetch(url, { method: "GET", cache: "no-store" });
    const text = await res.text();
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}\n${text}`);
    return text;
  }

  function parseValue(xmlText) {
    const m = xmlText.match(/<value><u8>(\d+)<\/u8><\/value>/i) ||
              xmlText.match(/<value><s8>(-?\d+)<\/s8><\/value>/i) ||
              xmlText.match(/<value><c8>(-?\d+)<\/c8><\/value>/i);
    return m ? Number(m[1]) : null;
  }

  async function refresh() {
    try {
      setMsg("Refreshing…");
      const [powerXml, volXml] = await Promise.all([
        fsapi("GET/netRemote.sys.power?pin=1234"),
        fsapi("GET/netRemote.sys.audio.volume?pin=1234")
      ]);

      const power = parseValue(powerXml);
      const volume = parseValue(volXml);

      $("powerState").textContent = power === 1 ? "On" : "Off";
      $("volumeValue").textContent = volume ?? "—";
      $("volume").value = volume ?? 0;
      $("connState").textContent = "Connected";
      setMsg("Updated.");
    } catch (e) {
      $("connState").textContent = "Error";
      setMsg(e.message);
    }
  }

  async function setPower(on) {
    try {
      setMsg("Sending power command…");
      await fsapi(`SET/netRemote.sys.power?pin=1234&value=${on ? 1 : 0}`);
      await refresh();
    } catch (e) {
      setMsg(e.message);
    }
  }

  let volumeTimer = null;
  $("volume").addEventListener("input", () => {
    $("volumeValue").textContent = $("volume").value;
    clearTimeout(volumeTimer);
    volumeTimer = setTimeout(async () => {
      try {
        const v = $("volume").value;
        setMsg("Setting volume…");
        await fsapi(`SET/netRemote.sys.audio.volume?pin=1234&value=${v}`);
        setMsg("Volume updated.");
        await refresh();
      } catch (e) {
        setMsg(e.message);
      }
    }, 150);
  });

  $("powerOn").addEventListener("click", () => setPower(true));
  $("powerOff").addEventListener("click", () => setPower(false));
  $("refresh").addEventListener("click", refresh);

  refresh();
</script>
  </script>
</body>
</html>
