<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Como Audio Duetto Controller</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#0b0f14; --card:#141a22; --muted:#8ea0b6; --text:#e8eef7;
      --good:#2ecc71; --bad:#ff6b6b; --line:#243041;
    }
    body { margin:0; font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:0 auto; padding:16px; }
    h1 { font-size:1.2rem; margin:0 0 12px; }
    .banner { padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin:10px 0 14px; background:rgba(255,255,255,.03); }
    .ok { border-color:rgba(46,204,113,.4); }
    .bad { border-color:rgba(255,107,107,.45); }
    .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
    label { display:block; font-size:.9rem; color:var(--muted); margin:8px 0 6px; }
    input, select, button, textarea {
      width:100%; box-sizing:border-box; border-radius:10px; border:1px solid var(--line);
      background:#0f141b; color:var(--text); padding:12px; font:inherit;
    }
    button { cursor:pointer; background:linear-gradient(180deg,#1b2533,#111722); }
    button.primary { background:linear-gradient(180deg,#2166c7,#17489c); border-color:#2b6fd2; }
    button.good { background:linear-gradient(180deg,#1f7a42,#155a31); border-color:#2f9b57; }
    button.bad { background:linear-gradient(180deg,#8c2d2d,#641f1f); border-color:#b14343; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .inline { display:flex; gap:10px; align-items:center; }
    .inline > * { flex:1; }
    .small { font-size:.9rem; color:var(--muted); }
    .status { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; word-break:break-word; min-height:44px; }
    textarea { min-height:84px; resize:vertical; }
    .sliderWrap { display:flex; gap:10px; align-items:center; }
    input[type="range"] { padding:0; }
    .pill {
      display:inline-block; padding:4px 8px; border:1px solid var(--line);
      border-radius:999px; margin-right:8px; color:var(--muted);
    }
    .toast {
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background:#111826; color:var(--text); border:1px solid var(--line);
      border-radius:999px; padding:10px 14px; opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .toast.show { opacity:1; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Como Audio Duetto Controller</h1>
  <div id="banner" class="banner">Ready.</div>

  <div class="grid">
    <div class="card">
      <h3>Connection</h3>
      <label>Host IP</label>
      <input id="host" value="192.168.68.70" />
      <label>PIN</label>
      <input id="pin" value="1234" />
      <div class="row" style="margin-top:10px;">
        <button id="saveBtn" class="primary" type="button">Save</button>
        <button id="testBtn" type="button">Test Connection</button>
      </div>
      <div class="small" style="margin-top:10px;">Response:</div>
      <div class="status" id="connOut"></div>
    </div>

    <div class="card">
      <h3>Power</h3>
      <div class="row">
        <button id="onBtn" class="good" type="button">Power On</button>
        <button id="offBtn" class="bad" type="button">Power Off</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <button id="powerTestBtn" class="primary" type="button">Known-Good Power Test</button>
        <button id="refreshBtn" type="button">Refresh Status</button>
      </div>
      <div class="small" style="margin-top:10px;">Status: <span id="powerState">unknown</span></div>
    </div>

    <div class="card">
      <h3>Volume</h3>
      <div class="sliderWrap">
        <button id="volDown" type="button">-</button>
        <input id="vol" type="range" min="0" max="40" value="17" />
        <button id="volUp" type="button">+</button>
      </div>
      <div class="inline" style="margin-top:10px;">
        <div class="pill">Volume: <span id="volVal">17</span></div>
        <button id="muteBtn" type="button">Mute</button>
      </div>
    </div>

    <div class="card">
      <h3>Raw Command</h3>
      <label>Path after host (e.g. /fsapi/GET/netRemote.sys.power)</label>
      <textarea id="rawIn"></textarea>
      <div class="row" style="margin-top:10px;">
        <button id="rawGet" type="button">Send GET</button>
        <button id="rawSet" type="button">Send SET</button>
      </div>
      <div class="status" id="rawOut" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h3>Presets / Source</h3>
      <div class="row3">
        <button disabled>1</button><button disabled>2</button><button disabled>3</button>
      </div>
      <div class="row3" style="margin-top:10px;">
        <button disabled>4</button><button disabled>5</button><button disabled>6</button>
      </div>
      <label style="margin-top:10px;">Source</label>
      <select id="sourceSel" disabled>
        <option>Loading…</option>
      </select>
    </div>

    <div class="card">
      <h3>Last Request</h3>
      <div class="status" id="lastUrl"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const $ = id => document.getElementById(id);

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 1400);
  }

  function setBanner(msg, good=false) {
    const b = $("banner");
    b.textContent = msg;
    b.className = "banner " + (good ? "ok" : "bad");
  }

  function loadPrefs() {
    $("host").value = localStorage.getItem("duetto_host") || "192.168.68.70";
    $("pin").value = localStorage.getItem("duetto_pin") || "1234";
  }

  function savePrefs() {
    localStorage.setItem("duetto_host", $("host").value.trim());
    localStorage.setItem("duetto_pin", $("pin").value.trim());
    toast("Saved");
  }

  function bust(url) {
    return url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
  }

  function buildUrl(path) {
    const host = $("host").value.trim();
    const pin = encodeURIComponent($("pin").value.trim() || "1234");
    const sep = path.includes("?") ? "&" : "?";
    return `http://${host}${path}${sep}pin=${pin}`;
  }

  function showLast(method, url, msg="") {
    $("lastUrl").textContent = `${method} ${url}\n${msg}`;
  }

  function parseValue(xml) {
    if (!xml) return "";
    const m = xml.match(/<[^>]+>(.*?)<\/[^>]+>/s);
    return m ? m[1].trim() : xml.trim();
  }

  async function apiFetch(path, methodLabel="REQ", note="Sending...") {
    const url = bust(buildUrl(path));
    showLast(methodLabel, url, note);
    const res = await fetch(url, { cache: "no-store", mode: "cors" });
    const text = await res.text();
    showLast(methodLabel, url, text);
    return text;
  }

  function ping(url, timeoutMs = 1200) {
    return new Promise(resolve => {
      const img = new Image();
      let done = false;
      const finish = ok => {
        if (done) return;
        done = true;
        resolve(ok);
      };
      const timer = setTimeout(() => finish(false), timeoutMs);
      img.onload = () => { clearTimeout(timer); finish(true); };
      img.onerror = () => { clearTimeout(timer); finish(true); };
      img.src = bust(url);
    });
  }

  async function refreshStatus() {
    try {
      const powerText = await apiFetch("/fsapi/GET/netRemote.sys.power", "GET", "Polling power");
      const powerVal = parseValue(powerText);
      $("powerState").textContent = powerVal === "1" ? "on" : powerVal === "0" ? "off" : powerVal;
    } catch (e) {
      $("powerState").textContent = "unknown";
    }

    try {
      const volText = await apiFetch("/fsapi/GET/netRemote.sys.audio.volume", "GET", "Polling volume");
      const volVal = parseInt(parseValue(volText), 10);
      if (!Number.isNaN(volVal)) {
        $("vol").value = volVal;
        $("volVal").textContent = volVal;
      }
    } catch (e) {}
  }

  async function testConnection(e) {
    if (e) e.preventDefault();

    const host = $("host").value.trim();
    const pin = encodeURIComponent($("pin").value.trim() || "1234");
    const url = `http://${host}/fsapi/GET/netRemote.sys.power?pin=${pin}`;
    $("connOut").textContent = "Testing...";
    showLast("GET", bust(url), "Testing fsapi...");

    try {
      const text = await apiFetch("/fsapi/GET/netRemote.sys.power", "GET", "Testing fsapi...");
      $("connOut").textContent = text.includes("FS_OK") ? "OK" : "Failed";
      setBanner(text.includes("FS_OK") ? "Connected." : "Connection response received.", text.includes("FS_OK"));
      $("rawOut").textContent = text;
    } catch (err) {
      const ok = await ping(url);
      $("connOut").textContent = ok ? "OK (image fallback)" : "Failed";
      setBanner(ok ? "Connected via fallback." : "Connection failed.", ok);
      $("rawOut").textContent = ok ? "Fallback ping completed" : String(err);
    }
  }

  async function sendSet(path, successLabel) {
    const url = buildUrl(path);
    showLast("SET", bust(url), "Sending...");
    try {
      const res = await fetch(bust(url), { cache: "no-store", mode: "cors" });
      const text = await res.text();
      showLast("SET", url, text || "Sent");
      return text;
    } catch (err) {
      await ping(url);
      showLast("SET", url, "Sent via image fallback");
      return "Sent via image fallback";
    }
  }

  async function powerOn(e) {
    if (e) e.preventDefault();
    $("connOut").textContent = "Sending...";
    await sendSet("/fsapi/SET/netRemote.sys.power?value=1");
    $("connOut").textContent = "Sent";
    setTimeout(refreshStatus, 1200);
  }

  async function powerOff(e) {
    if (e) e.preventDefault();
    $("connOut").textContent = "Sending...";
    await sendSet("/fsapi/SET/netRemote.sys.power?value=0");
    $("connOut").textContent = "Sent";
    setTimeout(refreshStatus, 1200);
  }

  function powerTest() {
    const host = $("host").value.trim();
    const pin = encodeURIComponent($("pin").value.trim() || "1234");
    const url = `http://${host}/fsapi/SET/netRemote.sys.power?value=1&pin=${pin}`;
    $("connOut").textContent = "Testing...";
    showLast("SET", bust(url), "Known-good power test...");
    ping(url).then(ok => {
      $("connOut").textContent = ok ? "Sent (fallback)" : "Failed";
      showLast("SET", url, ok ? "Sent via image fallback" : "Failed");
      setBanner(ok ? "Power test fired." : "Power test failed.", ok);
    });
  }

  async function setVolume(v) {
    v = Math.max(0, Math.min(40, v|0));
    $("vol").value = v;
    $("volVal").textContent = v;
    try {
      await apiFetch(`/fsapi/SET/netRemote.sys.audio.volume?value=${v}`, "SET", `Volume ${v}`);
    } catch (e) {
      const url = buildUrl(`/fsapi/SET/netRemote.sys.audio.volume?value=${v}`);
      await ping(url);
      showLast("SET", url, "Sent via image fallback");
    }
  }

  async function muteToggle() {
    const isMuted = $("muteBtn").dataset.state === "1";
    const prev = $("muteBtn").dataset.prev || $("vol").value || "17";
    if (!isMuted) $("muteBtn").dataset.prev = $("vol").value;
    $("muteBtn").dataset.state = isMuted ? "0" : "1";
    $("muteBtn").textContent = isMuted ? "Mute" : "Unmute";
    await setVolume(isMuted ? prev : 0);
  }

  async function sendRaw(method) {
    const p = $("rawIn").value.trim();
    if (!p.startsWith("/")) {
      $("rawOut").textContent = "Path must start with /";
      return;
    }
    try {
      const text = await apiFetch(p, method, "Raw request");
      $("rawOut").textContent = text;
    } catch (e) {
      const url = buildUrl(p);
      await ping(url);
      $("rawOut").textContent = "Sent via image fallback";
      showLast(method, url, "Sent via image fallback");
    }
  }

  $("saveBtn").onclick = () => { savePrefs(); refreshStatus(); };
  $("testBtn").onclick = testConnection;
  $("onBtn").onclick = powerOn;
  $("offBtn").onclick = powerOff;
  $("powerTestBtn").onclick = powerTest;
  $("refreshBtn").onclick = refreshStatus;
  $("vol").oninput = e => $("volVal").textContent = e.target.value;
  $("vol").onchange = e => setVolume(e.target.value);
  $("volUp").onclick = () => setVolume(parseInt($("vol").value, 10) + 1);
  $("volDown").onclick = () => setVolume(parseInt($("vol").value, 10) - 1);
  $("muteBtn").onclick = muteToggle;
  $("rawGet").onclick = () => sendRaw("GET");
  $("rawSet").onclick = () => sendRaw("SET");

  loadPrefs();
  refreshStatus();
  setInterval(refreshStatus, 5000);
</script>
</body>
</html>
